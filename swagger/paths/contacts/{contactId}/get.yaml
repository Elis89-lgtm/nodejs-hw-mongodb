tags:
  - Contacts

summary: Get contact by ID

operationId: getContactById

description: Retrieve a single contact by its unique ID. Requires a valid Bearer token.

security:
  - bearerAuth: []

parameters:
  - name: contactId
    in: path
    required: true
    description: The unique identifier of the contact
    schema:
      type: string
      example: '65e4decdd286b30065d54af9'

responses:
  '200':
    description: Get contact by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 65e4decdd286b30065d54af9!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml

  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact with id 65e4decdd286b30065d54af9 not found

  '401':
    $ref: '../../../components/responses/401.yaml'
