tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: 'Delete a contact by ID'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65e4decdd286b30065d54af9'
    description: 'ID of the contact to delete'
responses:
  '204':
    description: Successfully deleted contact

  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: number
              example: 404
            message:
              type: string
              example: Contact with id 65e4decdd286b30065d54af9 not found.
